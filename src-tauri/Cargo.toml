[package]
name = "atlas"
version = "0.1.0"
description = "Offline-first desktop assistant app"
authors = ["Kaivan Mehta"]
edition = "2021"

[lib]
name = "Atlas"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3.33"
rig = "0.41.0"
dotenvy = "0.15"
surrealdb = { version = "3.2.4", features = ["kv-surrealkv"] }
anyhow = "1.0.104"
chrono = "0.4.45"
